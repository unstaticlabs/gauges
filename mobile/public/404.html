<!doctype html>

<head>

<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --text: #1c1c1e;
    --muted: #5f6368;
    --line: #e2e2e6;
    --link: #1f6fd1;
    --panel: #f5f6f8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --text: #ececf0;
      --muted: #a1a1aa;
      --line: #2c2c32;
      --link: #7fb3ff;
      --panel: #1c1c20;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 42rem; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  header .brand { font-weight: 700; font-size: 1.1rem; color: var(--text); text-decoration: none; margin-right: auto; }
  header nav { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.95rem; }
  h1 { font-size: 1.75rem; line-height: 1.25; margin: 28px 0 4px; }
  h2 { font-size: 1.2rem; line-height: 1.3; margin: 32px 0 8px; }
  h3 { font-size: 1.02rem; line-height: 1.35; margin: 20px 0 4px; }
  p, ul, ol, table { margin: 0 0 14px; }
  ul, ol { padding-left: 1.25rem; }
  li { margin-bottom: 6px; }
  a { color: var(--link); }
  a[href^="mailto:"] { white-space: nowrap; }
  .muted { color: var(--muted); font-size: 0.95rem; }
  .panel { background: var(--panel); border-radius: 12px; padding: 14px 16px; margin: 16px 0; }
  .panel p:last-child { margin-bottom: 0; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
  th, td { text-align: left; vertical-align: top; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; }
  footer { margin-top: 40px; padding-top: 12px; border-top: 1px solid var(--line); }
</style>
</head>
<body>

<header>

</body>
</html>
