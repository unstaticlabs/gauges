# Checks the app and the Firestore rules. The workflow deploys nothing and
# needs no secrets. The app runs in demo mode, and the emulator tests use
# the demo project ID, which never connects to a live project.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            backend/package-lock.json

      # The Firebase emulator needs Java 21 or later.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The tests in backend/ import code from mobile/.
      - name: Install mobile
        working-directory: mobile
        run: npm ci

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Test backend on the emulator
        working-directory: backend
        run: npm test
